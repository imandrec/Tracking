<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracking">
<title>Tracking</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b0d14'/><g fill='%238b5cf6'><rect x='18' y='18' width='16' height='16' rx='4'/><rect x='42' y='18' width='16' height='16' rx='4' opacity='.4'/><rect x='66' y='18' width='16' height='16' rx='4'/><rect x='18' y='42' width='16' height='16' rx='4' opacity='.4'/><rect x='42' y='42' width='16' height='16' rx='4'/><rect x='66' y='42' width='16' height='16' rx='4'/><rect x='18' y='66' width='16' height='16' rx='4'/><rect x='42' y='66' width='16' height='16' rx='4'/><rect x='66' y='66' width='16' height='16' rx='4' opacity='.4'/></g></svg>">
<style>
  :root { --bg:#0b0d14; --card:#161a24; --card2:#1e2330; --ink:#f3f4f6; --dim:#8b92a5; --off:#262b38; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Text",system-ui,sans-serif; color:var(--ink); min-height:100vh;
    background:radial-gradient(120% 60% at 10% 0%, #2a1f45 0%, transparent 60%), radial-gradient(100% 50% at 100% 30%, #12304a 0%, transparent 60%), var(--bg);
    background-attachment:fixed; -webkit-font-smoothing:antialiased;
    padding:calc(14px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
  .wrap { max-width:560px; margin:0 auto; }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; }

  header { display:flex; justify-content:flex-end; gap:10px; margin:2px 2px 16px; }
  header small { color:var(--dim); font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
  header h1 { font-size:32px; font-weight:800; letter-spacing:-.03em; }
  .menu { width:38px; height:38px; border-radius:50%; background:var(--card); color:var(--dim); font-size:20px; }

  .summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:18px; }
  .ring { background:var(--card); border-radius:18px; padding:12px 4px 10px; text-align:center; }
  .ring svg { width:52px; height:52px; display:block; margin:0 auto 6px; transform:rotate(-90deg); }
  .ring .e { position:relative; }
  .ring .e span { position:absolute; inset:0; display:grid; place-items:center; font-size:20px; }
  .ring small { font-size:11px; color:var(--dim); font-weight:600; }

  .grid2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .card, .heat, .week { min-width:0; }
  html, body { overflow-x:hidden; }
  @media (max-width:600px) { .grid2 { grid-template-columns:minmax(0,1fr); } }
  .card { background:var(--card); border-radius:24px; padding:14px; box-shadow:0 8px 24px rgba(0,0,0,.25); }
  .head { display:flex; gap:10px; align-items:center; margin-bottom:12px; }
  .icon { width:38px; height:38px; border-radius:12px; background:var(--card2); display:grid; place-items:center; font-size:20px; flex:none; }
  .head h2 { font-size:17px; font-weight:700; line-height:1.15; }
  .card.done .head h2 { text-decoration:line-through; color:var(--dim); }
  .stats { font-size:12px; font-weight:700; color:var(--c); margin-top:2px; }
  .stats span { color:#fb923c; margin-left:8px; }

  .heat { display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,1fr); gap:3px; margin-bottom:12px; }
  .heat i { aspect-ratio:1; border-radius:3px; background:var(--off); display:block; }
  .heat i.on { background:var(--c); }
  .heat i.today { box-shadow:inset 0 0 0 1.5px #fff; }
  .heat i.future { visibility:hidden; }

  .btn { width:100%; padding:10px; border-radius:14px; font-weight:700; font-size:16px; background:var(--c); color:#0b0d14; transition:transform .1s; }
  .btn:active { transform:scale(.97); }
  .card:not(.done) .btn { background:color-mix(in srgb, var(--c) 22%, transparent); color:var(--c); }

  .week { display:flex; justify-content:space-between; gap:4px; margin-bottom:12px; }
  .week button { flex:1; min-width:0; border-radius:8px; padding:4px 0; font-size:10px; font-weight:700; color:var(--dim); display:flex; flex-direction:column; align-items:center; gap:3px; }
  .week b { width:22px; height:22px; border-radius:7px; background:var(--off); display:block; }
  .week button.on b { background:var(--c); }

  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-end; justify-content:center; z-index:9; }
  .sheet.on { display:flex; }
  .sheet > div { background:var(--card); width:100%; max-width:560px; border-radius:24px 24px 0 0; padding:20px 18px calc(24px + env(safe-area-inset-bottom)); }
  .sheet h3 { font-size:18px; margin-bottom:14px; }
  .sheet button.row { width:100%; text-align:left; padding:14px; border-radius:14px; background:var(--card2); margin-bottom:8px; font-weight:600; }
  .sheet input[type=password] { width:100%; padding:12px; border-radius:12px; border:0; background:var(--card2); color:var(--ink); font:inherit; margin-bottom:8px; }
  .sheet p { color:var(--dim); font-size:13px; margin:0 2px 10px; }
  .sync { font-size:12px; color:var(--dim); text-align:center; margin-top:18px; }
  .sheet input[type=text] { width:100%; padding:12px; border-radius:12px; border:0; background:var(--card2); color:var(--ink); font:inherit; font-size:16px; margin-bottom:10px; }
  .colors { display:flex; gap:10px; flex-wrap:wrap; margin:4px 0 16px; }
  .colors button { width:34px; height:34px; border-radius:50%; }
  .colors button.sel { box-shadow:0 0 0 3px var(--card), 0 0 0 5px #fff; }
  .sheet .primary { background:#fff; color:#000; text-align:center; }
  .sheet .danger { color:#f87171; text-align:center; }
  .empty { text-align:center; padding:60px 20px; color:var(--dim); }
  .empty button { margin-top:16px; padding:12px 22px; border-radius:14px; background:#fff; color:#000; font-weight:700; }
  .head { cursor:pointer; }
  .toast { position:fixed; left:50%; bottom:30px; transform:translateX(-50%); background:#fff; color:#000; padding:10px 16px; border-radius:20px; font-weight:600; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.on { opacity:1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="menu" id="addBtn" aria-label="Add habit">＋</button>
    <button class="menu" id="menuBtn" aria-label="Settings">⋯</button>
  </header>
  <section class="summary" id="summary"></section>
  <section class="grid2" id="cards"></section>
  <div class="sync" id="sync"></div>
</div>

<div class="sheet" id="sheet"><div>
  <h3>Settings</h3>
  <p>Cloud sync: paste a GitHub token with Gist access. Your data is saved to a secret gist on your account.</p>
  <input type="password" id="token" placeholder="GitHub token (ghp_… or github_pat_…)" autocomplete="off">
  <button class="row" id="saveToken">☁️ Save token &amp; sync</button>
  <button class="row" id="exportBtn">⬇️ Export backup</button>
  <button class="row" id="importBtn">⬆️ Import backup</button>
  <button class="row" id="closeBtn">Close</button>
  <input type="file" id="file" accept="application/json" hidden>
</div></div>
<div class="sheet" id="habitSheet"><div>
  <h3 id="habitTitle">New habit</h3>
  <input type="text" id="hName" placeholder="Name (e.g. Read, No coffee)" maxlength="40">
  <input type="text" id="hEmoji" placeholder="Emoji (optional) 📚" maxlength="4">
  <div class="colors" id="hColors"></div>
  <button class="row primary" id="hSave">Save</button>
  <button class="row danger" id="hDelete">Delete habit</button>
  <button class="row" id="hCancel">Cancel</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var DEFAULTS = [
    { id: "alcohol",  name: "No alcohol", emoji: "🍷", color: "#f87171" },
    { id: "sugar",    name: "No sugar",   emoji: "🍬", color: "#f472b6" },
    { id: "piano",    name: "Piano",      emoji: "🎹", color: "#a78bfa" },
    { id: "exercise", name: "Exercise",   emoji: "🏋️", color: "#facc15" }
  ];
  var KEY = "tracking.v2", WEEKS = 18;
  var $ = function (s) { return document.querySelector(s); };

  function key(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var T = key(today);

  function load() {
    try { var d = JSON.parse(localStorage.getItem(KEY)); if (d && d.log) return fix(d); } catch (e) {}
    var data = { log: {}, habits: [] };

    try {
      var old = JSON.parse(localStorage.getItem("tracking.v1"));
      if (old && old.days) Object.keys(old.days).forEach(function (k) {
        var o = old.days[k];
        if (!data.habits.length) { data.habits = DEFAULTS.slice(); DEFAULTS.forEach(function (h) { data.log[h.id] = {}; }); }
        if (!o.alc) data.log.alcohol[k] = 1;
        if (!o.sug) data.log.sugar[k] = 1;
        if (o.gym) data.log.exercise[k] = 1;
      });
    } catch (e) {}
    return data;
  }
  function fix(d) {
    if (!d.habits) d.habits = DEFAULTS.filter(function (h) { return d.log[h.id] && Object.keys(d.log[h.id]).length; });
    d.habits.forEach(function (h) { d.log[h.id] = d.log[h.id] || {}; });
    return d;
  }
  function esc(t) { return String(t).replace(/[&<>"']/g, function (c) { return "&#" + c.charCodeAt(0) + ";"; }); }
  var data = load();
  function store() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { toast("Couldn't save"); } }
  function save() { data.updated = Date.now(); store(); push(); }

  var TK = "tracking.token", GK = "tracking.gist", FILE = "tracking-data.json", timer;
  function token() { return localStorage.getItem(TK) || ""; }
  function status(t) { $("#sync").textContent = t; }
  function gh(path, opt) {
    opt = opt || {};
    opt.headers = { Authorization: "Bearer " + token(), Accept: "application/vnd.github+json", "Content-Type": "application/json" };
    return fetch("https://api.github.com" + path, opt).then(function (r) { if (!r.ok) throw r.status; return r.json(); });
  }
  function findGist() {
    var id = localStorage.getItem(GK);
    if (id) return Promise.resolve(id);
    return gh("/gists?per_page=100").then(function (list) {
      var g = list.find(function (x) { return x.files[FILE]; });
      if (g) { localStorage.setItem(GK, g.id); return g.id; }
      return gh("/gists", { method: "POST", body: JSON.stringify({ description: "Tracking app data", public: false, files: { [FILE]: { content: JSON.stringify(data) } } }) })
        .then(function (n) { localStorage.setItem(GK, n.id); return n.id; });
    });
  }
  function push() {
    if (!token()) return;
    clearTimeout(timer); status("Saving…");
    timer = setTimeout(function () {
      findGist().then(function (id) {
        return gh("/gists/" + id, { method: "PATCH", body: JSON.stringify({ files: { [FILE]: { content: JSON.stringify(data) } } }) });
      }).then(function () { status("☁️ Saved to GitHub"); }).catch(fail);
    }, 800);
  }
  function pull() {
    if (!token()) { status("Saved on this device only · ⋯ to turn on sync"); return Promise.resolve(); }
    status("Syncing…");
    return findGist().then(function (id) { return gh("/gists/" + id); }).then(function (g) {
      var remote = JSON.parse(g.files[FILE].content || "{}");
      if (remote.log && (remote.updated || 0) > (data.updated || 0)) {
        data = fix(remote);
        store(); render(); status("☁️ Synced from GitHub");
      } else if ((data.updated || 0) > (remote.updated || 0)) push();
      else status("☁️ Synced");
    }).catch(fail);
  }
  function fail(e) {
    if (e === 401 || e === 403) { status("⚠️ Token rejected · ⋯ to fix"); }
    else if (e === 404) { localStorage.removeItem(GK); status("⚠️ Gist not found, will recreate"); }
    else status("⚠️ Offline · saved on this device");
  }
  function toast(t) { var el = $("#toast"); el.textContent = t; el.classList.add("on"); setTimeout(function () { el.classList.remove("on"); }, 1600); }
  function toggle(h, k) { if (data.log[h][k]) delete data.log[h][k]; else data.log[h][k] = 1; save(); render(); }

  function streak(h) {
    var n = 0, d = new Date(today);
    if (!data.log[h][key(d)]) d = addDays(d, -1);
    while (data.log[h][key(d)]) { n++; d = addDays(d, -1); }
    return n;
  }
  function weekCount(h) { var n = 0; for (var i = 0; i < 7; i++) if (data.log[h][key(addDays(today, -i))]) n++; return n; }

  function render() {
    var H = data.habits;
    if (!H.length) {
      $("#summary").innerHTML = "";
      $("#cards").innerHTML = '<div class="empty"><div style="font-size:40px">✨</div><p>What do you want to track?</p><button id="emptyAdd">＋ Add a habit</button></div>';
      $("#emptyAdd").onclick = function () { openHabit(); };
      return;
    }
    $("#summary").style.gridTemplateColumns = "repeat(" + Math.min(H.length, 4) + ",minmax(0,1fr))";

    $("#summary").innerHTML = H.map(function (h) {
      var n = weekCount(h.id), C = 2 * Math.PI * 22;
      return '<div class="ring"><div class="e"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="22" fill="none" stroke="#262b38" stroke-width="5"/>' +
        '<circle cx="26" cy="26" r="22" fill="none" stroke="' + h.color + '" stroke-width="5" stroke-linecap="round" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - n / 7)) + '"/></svg>' +
        '<span>' + esc(h.emoji) + '</span></div><small>' + n + '/7 days</small></div>';
    }).join("");


    var start = addDays(today, -((today.getDay() + 6) % 7) - 7 * (WEEKS - 1));
    $("#cards").innerHTML = H.map(function (h) {
      var log = data.log[h.id], done = !!log[T], total = Object.keys(log).length, cells = "", week = "";
      for (var i = 0; i < WEEKS * 7; i++) {
        var d = addDays(start, i), k = key(d);
        cells += '<i class="' + (log[k] ? "on " : "") + (k === T ? "today " : "") + (d > today ? "future" : "") + '"></i>';
      }
      for (var j = 6; j >= 0; j--) {
        var dd = addDays(today, -j), kk = key(dd);
        week += '<button data-h="' + h.id + '" data-k="' + kk + '" class="' + (log[kk] ? "on" : "") + '"><b></b>' + dd.toLocaleDateString("en-US", { weekday: "narrow" }) + '</button>';
      }
      return '<article class="card ' + (done ? "done" : "") + '" style="--c:' + h.color + '">' +
        '<div class="head" data-edit="' + h.id + '"><div class="icon">' + esc(h.emoji) + '</div><div><h2>' + esc(h.name) + '</h2>' +
        '<div class="stats">' + total + ' ✓<span>' + streak(h.id) + ' 🔥</span></div></div></div>' +
        '<div class="heat">' + cells + '</div>' +
        '<div class="week">' + week + '</div>' +
        '<button class="btn" data-h="' + h.id + '" data-k="' + T + '">' + (done ? "✓ Completed" : "Complete") + '</button></article>';
    }).join("");
  }

  $("#cards").addEventListener("click", function (e) {
    var ed = e.target.closest("[data-edit]");
    if (ed) return openHabit(ed.dataset.edit);
    var b = e.target.closest("button[data-h]");
    if (b) { if (navigator.vibrate) navigator.vibrate(10); toggle(b.dataset.h, b.dataset.k); }
  });

  var COLORS = ["#f87171", "#fb923c", "#facc15", "#4ade80", "#2dd4bf", "#60a5fa", "#a78bfa", "#f472b6"], editing = null, pick = COLORS[0];
  function drawColors() {
    $("#hColors").innerHTML = COLORS.map(function (c) { return '<button data-c="' + c + '" class="' + (c === pick ? "sel" : "") + '" style="background:' + c + '"></button>'; }).join("");
  }
  $("#hColors").onclick = function (e) { var b = e.target.closest("[data-c]"); if (b) { pick = b.dataset.c; drawColors(); } };
  function openHabit(id) {
    var h = data.habits.find(function (x) { return x.id === id; });
    editing = h || null;
    $("#habitTitle").textContent = h ? "Edit habit" : "New habit";
    $("#hName").value = h ? h.name : ""; $("#hEmoji").value = h ? h.emoji : "";
    pick = h ? h.color : COLORS[data.habits.length % COLORS.length]; drawColors();
    $("#hDelete").style.display = h ? "" : "none";
    $("#habitSheet").classList.add("on");
    setTimeout(function () { $("#hName").focus(); }, 50);
  }
  function closeHabit() { $("#habitSheet").classList.remove("on"); }
  $("#addBtn").onclick = function () { openHabit(); };
  $("#hCancel").onclick = closeHabit;
  $("#habitSheet").onclick = function (e) { if (e.target.id === "habitSheet") closeHabit(); };
  $("#hSave").onclick = function () {
    var name = $("#hName").value.trim(); if (!name) { $("#hName").focus(); return; }
    var emoji = $("#hEmoji").value.trim() || "⭐";
    if (editing) { editing.name = name; editing.emoji = emoji; editing.color = pick; }
    else {
      var id = "h" + Date.now().toString(36);
      data.habits.push({ id: id, name: name, emoji: emoji, color: pick }); data.log[id] = {};
    }
    closeHabit(); save(); render();
  };
  $("#hDelete").onclick = function () {
    if (!editing || !confirm("Delete \"" + editing.name + "\" and its history?")) return;
    var id = editing.id;
    data.habits = data.habits.filter(function (x) { return x.id !== id; }); delete data.log[id];
    closeHabit(); save(); render();
  };

  $("#menuBtn").onclick = function () { $("#token").value = token(); $("#sheet").classList.add("on"); };
  $("#saveToken").onclick = function () {
    var t = $("#token").value.trim();
    if (t) localStorage.setItem(TK, t); else localStorage.removeItem(TK);
    localStorage.removeItem(GK);
    $("#sheet").classList.remove("on");
    pull().then(function () { if (t) toast("Sync on"); });
  };
  document.addEventListener("visibilitychange", function () { if (!document.hidden) pull(); });
  $("#closeBtn").onclick = function () { $("#sheet").classList.remove("on"); };
  $("#sheet").onclick = function (e) { if (e.target.id === "sheet") this.classList.remove("on"); };
  $("#exportBtn").onclick = function () {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
    a.download = "tracking-" + T + ".json"; a.click();
  };
  $("#importBtn").onclick = function () { $("#file").click(); };
  $("#file").onchange = function () {
    var f = this.files[0]; if (!f) return;
    f.text().then(function (t) {
      var d = JSON.parse(t); if (!d.log) throw 0;
      data = fix(d);
      data.updated = 0; save(); render(); toast("Imported"); $("#sheet").classList.remove("on");
    }).catch(function () { toast("Invalid file"); });
  };

  render();
  pull();
})();
</script>
</body>
</html>
